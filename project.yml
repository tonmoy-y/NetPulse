name: NetPulse
options:
  bundleIdPrefix: com.tonmoysarkersourav
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  NetPulseCore:
    path: NetPulseCore

targets:
  NetPulse:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: NetPulse
        excludes:
          - "Resources/Info.plist"
          - "Resources/NetPulse.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonmoysarkersourav.netpulse
        PRODUCT_NAME: NetPulse
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NetPulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetPulse/Resources/NetPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc signing by default so `open NetPulse.xcodeproj` + Run just
        # works with no Apple ID / paid developer account needed — Xcode's
        # "Automatic" signing style fails with "requires a development team"
        # unless you've added an account, which is the #1 cause of a fresh
        # clone not building. If you DO have a Developer ID and want to
        # notarize for distribution outside this repo's CI, override these
        # per-scheme in Xcode's Signing & Capabilities instead of editing here.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
      configs:
        # Release binaries were shipping with their full symbol table.
        # Stripping (with dead-code removal) shrinks the executable on disk
        # and the memory mapped at launch; crash symbolication isn't lost
        # because the symbols go into the separate .dSYM.
        Release:
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: NetPulseCore
        product: NetPulseCore

schemes:
  NetPulse:
    build:
      targets:
        NetPulse: all
    run:
      config: Debug
    archive:
      config: Release
