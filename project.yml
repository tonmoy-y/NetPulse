name: NetPulse
options:
  bundleIdPrefix: com.tonmoysarkersourav
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  NetPulseCore:
    path: NetPulseCore

targets:
  NetPulse:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: NetPulse
        excludes:
          - "Resources/Info.plist"
          - "Resources/NetPulse.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonmoysarkersourav.netpulse
        PRODUCT_NAME: NetPulse
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NetPulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetPulse/Resources/NetPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: NetPulseCore
        product: NetPulseCore

schemes:
  NetPulse:
    build:
      targets:
        NetPulse: all
    run:
      config: Debug
    archive:
      config: Release
